name: Update SDR Redirect

concurrency:
  group: update-ip
  cancel-in-progress: true
  
on:
  repository_dispatch:
    types: [update_server_ip]

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync, Write and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Жестко синхронизируемся с сервером
          git fetch origin main
          git reset --hard origin/main
          
          # Генерируем свежий sdr.html
          echo '<!DOCTYPE html><html><head>' > sdr.html
          echo '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">' >> sdr.html
          echo '<meta http-equiv="Pragma" content="no-cache">' >> sdr.html
          echo '<meta http-equiv="Expires" content="0">' >> sdr.html
          echo '<meta http-equiv="refresh" content="0; url=steam://run/440//+connect ${{ github.event.client_payload.ip }}/">' >> sdr.html
          echo '</head><body></body></html>' >> sdr.html
          
          git add sdr.html
          
          # Проверяем, изменился ли IP. Если нет — не спамим коммитами
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Auto-update SDR IP"
          git push origin main --force
