name: Update SDR Redirect
on:
  repository_dispatch:
    types: [update_server_ip]

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Rewrite sdr.html
        run: |
          echo '<meta http-equiv="refresh" content="0; url=steam://connect/${{ github.event.client_payload.ip }}">' > sdr.html
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdr.html
          git commit -m "Auto-update SDR IP in sdr.html"
          git push
